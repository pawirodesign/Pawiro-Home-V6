<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17243a"><link rel="manifest" href="manifest.json"><title>Pawiro Home V5</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f1e9;color:#243047;font:16px system-ui,sans-serif;padding-bottom:70px}header{height:70px;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#f7f1e9ee;z-index:5}.brand{display:flex;gap:10px;align-items:center}.logo{width:48px;height:48px;object-fit:contain;border-radius:12px;background:white}.muted{color:#727b88;font-size:13px}.hero{margin:16px 18px;padding:24px;border-radius:22px;background:#17243a;color:white}.hero h1{margin:0 0 5px}.card{background:white;border-radius:18px;padding:16px;margin:12px 18px;box-shadow:0 3px 15px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 18px}.grid .card{margin:0}.btn{border:0;border-radius:11px;padding:10px 13px;background:#e98573;color:white;font-weight:800}.dark{background:#17243a}.row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #eee5dc}.row:last-child{border:0}.check{width:23px;height:23px;border:2px solid #ccc;border-radius:50%;background:white}.check.done{background:#68a77b;border-color:#68a77b}.grow{flex:1}.pill{font-size:10px;font-weight:800;background:#eee8df;padding:5px 7px;border-radius:8px}.weather{display:grid;grid-template-columns:1fr 2fr;gap:10px}.now{background:#eef3f7;padding:14px;border-radius:14px}.temp{font-size:34px;font-weight:900}.forecast{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.forecast div{padding:10px;background:#fff;border:1px solid #eee5dc;border-radius:12px;text-align:center;font-size:12px}.mealgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:12px 18px}.day{background:#fff;border-radius:13px;padding:9px;min-height:115px}.meal{margin-top:8px;background:#eef3f7;border-radius:9px;padding:7px;font-size:12px}.progress{height:10px;background:#eee8df;border-radius:10px;overflow:hidden}.fill{height:100%;background:#68a77b}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e9e1d8;display:flex;justify-content:center;gap:5px;padding:8px;z-index:20}nav button{border:0;background:none;font-weight:800;padding:8px}.tablet{position:fixed;inset:0;z-index:50;background:#f7f1e9;overflow:auto}.tabletHead{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid #e9e1d8}.clock{font-size:45px;font-weight:900;text-align:right}.tabletGrid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;max-width:1400px;margin:auto;padding:18px}.exit{position:fixed;right:18px;top:15px;z-index:60}.views{display:flex;gap:7px;flex-wrap:wrap}.view{border:1px solid #ddd4ca;background:white;border-radius:9px;padding:8px 12px;font-weight:800}.active{background:#17243a;color:white}@media(max-width:750px){.grid,.tabletGrid{grid-template-columns:1fr}.weather{grid-template-columns:1fr}.forecast{grid-template-columns:repeat(2,1fr)}.mealgrid{grid-template-columns:repeat(2,1fr)}nav button{font-size:11px;padding:8px 5px}.clock{font-size:34px}}
</style></head><body>
<header><div class="brand"><img id="logo" class="logo" alt="Pawiro Home"><div><b>Pawiro Home</b><div class="muted">Household management</div></div></div><button class="btn dark" onclick="tablet()">Tablet mode</button></header><main id="app"></main>
<nav><button onclick="home()">Home</button><button onclick="chores()">Chores</button><button onclick="meals()">Meals</button><button onclick="shopping()">Shopping</button><button onclick="calendar()">Calendar</button><button onclick="family()">Family</button></nav>
<script>
const choresData=[["Wipe kitchen surfaces","Kitchen","8 min","⚡","Baseline"],["Deep clean oven","Kitchen","25 min","⚡⚡⚡","Bonus Quest +25 ⭐"],["Mow lawn","Garden","30 min","⚡⚡⚡","Baseline"],["Pull weeds","Garden","20 min","⚡⚡","Bonus Quest +15 ⭐"],["Pay electricity bill","Life Admin","10 min","⚡","Baseline"]];
const events=[["Dentist","Appointment","25 Aug · 10:30","Stephan"],["Swim lesson","Activity","26 Aug · 17:00","Child"],["Family day out","Activity","29 Aug · 11:00","Everyone"]];
const mealsData=["Chicken pasta","Nasi goreng","Paella","Falafel wraps","Pizza night","Curry","Roast dinner"];
const recipes=[["Chicken pasta","Chicken breast, Fusilli, Spinach, Garlic"],["Nasi goreng","Rice, Eggs, Chicken, Vegetables"],["Falafel wraps","Falafel, Flatbread, Lettuce, Tomato"]];
function tasks(a=choresData){return a.map(x=>`<div class=row><button class=check onclick="this.classList.toggle('done')"></button><div class=grow><b>${x[0]}</b><div class=muted>${x[1]} · ${x[2]} · ${x[3]}</div></div><span class=pill>${x[4]}</span></div>`).join("")}
function evs(){return events.map(e=>`<div class=row><span class=pill>${e[1]}</span><div><b>${e[0]}</b><div class=muted>${e[2]} · ${e[3]}</div></div></div>`).join("")}
function weather(){return `<div class=card><div class=weather><div class=now><div class=muted>Today</div><div class=temp>16°C</div><b>Partly cloudy</b><div class=muted>High 18° · Low 11°</div></div><div class=forecast><div>Mon<br>Cloudy<br><b>17°</b></div><div>Tue<br>Sunny<br><b>19°</b></div><div>Wed<br>Showers<br><b>18°</b></div><div>Thu<br>Cloudy<br><b>16°</b></div></div></div></div>`}
function home(){app.innerHTML=`<section class=hero><h1>Good morning</h1><p>Your household at a glance.</p><button class=btn onclick="suggest(30)">What should I do now?</button><div style="margin-top:15px"><b>Available time</b><div class=views style="margin-top:8px"><button class=view onclick="suggest(15)">15 min</button><button class=view onclick="suggest(30)">30 min</button><button class=view onclick="suggest(60)">60 min</button></div></div></section><div class=section></div><div class=card><b>Weather forecast</b>${weather()}</div><div class=card><b>Needs attention</b>${tasks(choresData.slice(0,3))}</div><div class=card><b>Upcoming</b>${evs()}</div><div class=grid><div class=card><b>Today's meal</b><h3>${mealsData[0]}</h3></div><div class=card><b>Next bin</b><h3>Green bin</h3><div class=muted>This week</div></div></div><div class=card><b>Shared goal · Movie Night</b><div class=muted>215 / 500 ⭐</div><div class=progress><div class=fill style="width:43%"></div></div></div>`}
function suggest(m){let list=m<=15?choresData.slice(0,1):m>=60?choresData.slice(1,4):choresData.slice(0,3);alert(m+" minute plan:\\n"+list.map(x=>"• "+x[0]+" — "+x[2]).join("\\n"))}
function chores(){app.innerHTML=`<section class=hero><h1>Chores</h1><p>Rooms · Garden · Life Admin · Bonus Quests</p></section><div class=card>${tasks()}</div><div class=card><b>Bin collection</b><p>🟢 This week: Green</p><p>Next: Grey</p><p>Following: Brown</p><button class=btn onclick="alert('Admin can configure bin colours, collection day and rotation. A future council API can automate this.')">Manage schedule</button></div>`}
function meals(){app.innerHTML=`<section class=hero><h1>Meals & Recipes</h1><p>Plan meals and send ingredients to the shared shopping list.</p></section><div class=mealgrid>${mealsData.map((m,i)=>`<div class=day><b>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</b><div class=meal>${m}</div><button class=btn style="margin-top:7px;padding:7px;font-size:11px" onclick="alert('${m}\\n\\nRecipe ingredients can be added to shopping.')">Recipe</button></div>`).join("")}</div><div class=card><b>Recipe library</b>${recipes.map(r=>`<div class=row><div class=grow><b>${r[0]}</b><div class=muted>${r[1]}</div></div><button class=btn onclick="alert('Ingredients added to shopping list.')">Add</button></div>`).join("")}</div>`}
function shopping(){app.innerHTML=`<section class=hero><h1>Shopping</h1><p>One shared household list.</p></section><div class=card>${["Milk","Bread","Washing-up liquid","Toilet paper"].map(x=>`<div class=row><button class=check onclick="this.classList.toggle('done')"></button><div class=grow><b>${x}</b><div class=muted>Shared</div></div></div>`).join("")}<button class=btn onclick="alert('Add item')">+ Add item</button></div>`}
function calendar(){app.innerHTML=`<section class=hero><h1>Calendar</h1><p>Household schedule</p></section><div class=card><div class=views><button class="view active">Day</button><button class=view>Week</button><button class=view>Month</button><button class=view>Year</button></div></div><div class=card>${evs()}<div class=row><span class=pill>Meal</span><div><b>${mealsData[0]}</b><div class=muted>Dinner</div></div></div></div>`}
function family(){app.innerHTML=`<section class=hero><h1>Family</h1><p>Members, permissions and household balance.</p></section><div class=grid><div class=card><b>Admin</b><p class=muted>Can manage household, members, tasks, rewards and approvals.</p></div><div class=card><b>Standard</b><p class=muted>Can view and complete assigned tasks, calendar, meals and shopping.</p></div></div><div class=card><b>Household balance</b><p>Member A · 2h 15m</p><div class=progress><div class=fill style="width:65%"></div></div><p>Member B · 1h 55m</p><div class=progress><div class=fill style="width:55%"></div></div></div><div class=card><b>Life Admin</b><p class=muted>Bills · insurance · appointments · MOT · school forms · repairs</p></div>`}
function tablet(){let t=document.createElement("div");t.className="tablet";t.innerHTML=`<button class="btn exit" onclick="this.parentElement.remove()">Exit</button><div class=tabletHead><div class=brand><img class=logo src="assets/logo.png"><div><b>Pawiro Home</b><div class=muted>Always-on household dashboard</div></div></div><div><div id=clock class=clock></div><div id=date class=muted style=text-align:right></div></div></div><div class=tabletGrid><div>${weather()}<div class=card><b>Today's focus</b>${tasks(choresData.slice(0,3))}</div></div><div><div class=card><b>Upcoming</b>${evs()}</div><div class=card><b>Tonight</b><h3>${mealsData[0]}</h3></div><div class=card><b>Movie Night</b><p>215 / 500 ⭐</p><div class=progress><div class=fill style=width:43%></div></div></div><div class=card><b>Next bin</b><h3>Green bin</h3></div></div></div>`;document.body.appendChild(t);function tick(){let d=new Date();t.querySelector("#clock").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});t.querySelector("#date").textContent=d.toLocaleDateString([],{weekday:"long",day:"numeric",month:"long"})}tick();setInterval(()=>document.body.contains(t)&&tick(),1000)}
home();
</script></body></html>
